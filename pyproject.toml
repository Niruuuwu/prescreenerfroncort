[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prescreener"
version = "0.1.0"
description = "Type 2 Diabetes Clinical Trial Pre-Screening Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_eval_suite.py", "test_original_metric.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["prescreener"]
